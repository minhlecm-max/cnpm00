<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR Menu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body style="text-align:center">

<h2>Quét QR để gọi món</h2>
<input id="table" value="1">
<div id="qr"></div>

<script>
const qr = new QRCode(document.getElementById("qr"));
function gen() {
  qr.makeCode(`https://minhlecm-max.github.io/cnpm00/menu.html?table=${table.value}`);
}
table.oninput = gen;
gen();
</script>

</body>
</html>
